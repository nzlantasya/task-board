<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Task Board</title>
    <link rel="stylesheet" href="stylee.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Team Task Board</h1>
            <p>Manage your team tasks easily</p>
        </header>

        <!-- Input Section with Dropdown -->
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Enter new task title..." autocomplete="off">
            
            <select id="taskStatus">
                <option value="todo">To Do</option>
                <option value="doing">In Progress</option>
                <option value="done">Done</option>
            </select>
            
            <button id="addBtn">Add Task</button>
        </div>

        <div class="board">
            <div class="column" id="todo">
                <h2 class="header-todo">To Do</h2>
                <div class="task-list" id="list-todo"></div>
            </div>

            <div class="column" id="doing">
                <h2 class="header-doing">In Progress</h2>
                <div class="task-list" id="list-doing"></div>
            </div>

            <div class="column" id="done">
                <h2 class="header-done">Done</h2>
                <div class="task-list" id="list-done"></div>
            </div>
        </div>
    </div>

    <script src="scriptt.js"></script>
</body>
</html>
